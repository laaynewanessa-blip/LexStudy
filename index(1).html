<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<script>
window.__lexAddStyle = function(css) {
  const style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);
};
window.__lexRegisterMenuCommand = function() {};
</script>
<script>

(function () {
    'use strict';

    /* =========================================================
       FSH - MEUS ESTUDOS V3.1
       ========================================================= */

    const STORAGE = 'lexstudy_fsh_v40';
    const LEGACY_STORAGE = 'lexstudy_fsh_v32';

    // Evita que o script seja injetado duas vezes na mesma página.
    if (window.__LEXSTUDY_FSH_V40__) return;
    window.__LEXSTUDY_FSH_V40__ = true;

    const OFFICIAL_GRADE = [
        {
            subject: 'MEDIDAS PROCESSUAIS ATÍPICAS: CAUTELARES E ESPECIAIS',
            day: 'segunda',
            start: '19:00',
            end: '21:45'
        },
        {
            subject: 'DIREITO DIGITAL',
            day: 'terça',
            start: '19:00',
            end: '21:45'
        },
        {
            subject: 'DIREITO PROCESSUAL PENAL RECURSA',
            day: 'quarta',
            start: '19:00',
            end: '21:45'
        },
        {
            subject: 'RECUPERAÇÃO DE EMPRESAS E TÍTULOS DE CRÉDITO',
            day: 'quinta',
            start: '19:00',
            end: '21:45'
        },
        {
            subject: 'TEORIA GERAL DO DIREITO TRIBUTÁRIO E FINANCEIRO',
            day: 'sexta',
            start: '19:00',
            end: '21:45'
        },
        {
            subject: 'PRÁTICA JURÍDICA PENAL',
            day: 'sábado',
            start: '08:00',
            end: '11:15'
        }
    ];

    const SUBJECTS = OFFICIAL_GRADE.map(x => x.subject);

    const DAY_NAMES = [
        'domingo',
        'segunda',
        'terça',
        'quarta',
        'quinta',
        'sexta',
        'sábado'
    ];

    const DEFAULT_TARGET = 300;

    function uid(prefix = 'id') {
        return prefix + '_' + Date.now() + '_' +
            Math.random().toString(36).slice(2, 8);
    }

    function todayISO() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function dateISO(date) {
        const d = new Date(date);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function parseDate(value) {
        if (!value) return null;
        const d = new Date(value + 'T00:00:00');
        return isNaN(d.getTime()) ? null : d;
    }

    function daysBetween(a, b) {
        const d1 = new Date(a);
        const d2 = new Date(b);
        d1.setHours(0, 0, 0, 0);
        d2.setHours(0, 0, 0, 0);
        return Math.floor((d2 - d1) / 86400000);
    }

    function escapeHTML(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function minutesFromSeconds(seconds) {
        return Math.max(0, Math.floor(seconds / 60));
    }

    function formatTime(seconds) {
        seconds = Math.max(0, Math.floor(seconds));
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;

        if (h > 0) {
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function defaultState() {
        const weeklySubjectMinutes = {};

        SUBJECTS.forEach(subject => {
            weeklySubjectMinutes[subject] = 50;
        });

        return {
            sessions: [],
            reviews: [],
            lessons: [],
            notebookEntries: [],
            questions: [],
            questionAttempts: [],
            agenda: [],
            goal: {
                weeklyMinutes: DEFAULT_TARGET,
                dailyMinutes: 30
            },
            plan: {
                weeklySubjectMinutes,
                exams: [],
                assignments: []
            },
            xp: 0,
            level: 1,
            achievements: [],
            flashcards: [],
            summaries: [],
            pomodoroStats: {
                completed: 0,
                focusMinutes: 0,
                breakMinutes: 0
            },
            settings: {
                buttonPosition: {
                    right: 20,
                    top: 120
                },
                darkMode: false
            },
            studyTimer: {
                active: false,
                paused: false,
                subject: '',
                startedAt: null,
                elapsedSeconds: 0,
                targetMinutes: 30,
                mode: 'custom',
                phase: 'study',
                breakMinutes: 0,
                cycle: 0
            },
            ui: {
                tab: 'dashboard',
                questionMode: 'all',
                questionFilter: '',
                questionSearch: '',
                notebookFilter: '',
                notebookSearch: '',
                simulationSize: 10,
                globalSearch: '',
                calendarMonth: todayISO().slice(0, 7),
                flashcardFilter: 'due',
                flashcardReveal: {},
                pomodoroMode: '25/5'
            }
        };
    }

    function normalizeState(data) {
        const base = defaultState();

        data = data || {};

        const state = {
            ...base,
            ...data
        };

        state.sessions = Array.isArray(data.sessions) ? data.sessions : [];
        state.reviews = Array.isArray(data.reviews) ? data.reviews : [];
        state.lessons = Array.isArray(data.lessons) ? data.lessons : [];
        state.notebookEntries = Array.isArray(data.notebookEntries)
            ? data.notebookEntries
            : [];
        state.questions = Array.isArray(data.questions)
            ? data.questions
            : [];
        state.questionAttempts = Array.isArray(data.questionAttempts)
            ? data.questionAttempts
            : [];
        state.agenda = Array.isArray(data.agenda)
            ? data.agenda
            : [];

        state.goal = {
            ...base.goal,
            ...(data.goal || {})
        };

        state.plan = {
            ...base.plan,
            ...(data.plan || {})
        };

        state.plan.weeklySubjectMinutes = {
            ...base.plan.weeklySubjectMinutes,
            ...(data.plan?.weeklySubjectMinutes || {})
        };

        state.plan.exams = Array.isArray(data.plan?.exams)
            ? data.plan.exams
            : [];

        state.plan.assignments = Array.isArray(data.plan?.assignments)
            ? data.plan.assignments
            : [];
        state.flashcards = Array.isArray(data.flashcards) ? data.flashcards : [];
        state.summaries = Array.isArray(data.summaries) ? data.summaries : [];
        state.pomodoroStats = {
            ...base.pomodoroStats,
            ...(data.pomodoroStats || {})
        };

        state.studyTimer = {
            ...base.studyTimer,
            ...(data.studyTimer || {})
        };

        state.settings = {
            ...base.settings,
            ...(data.settings || {}),
            buttonPosition: {
                ...base.settings.buttonPosition,
                ...(data.settings?.buttonPosition || {})
            }
        };

        state.ui = {
            ...base.ui,
            ...(data.ui || {})
        };

        // Compatibilidade com versões anteriores
        state.ui.questionFilter = state.ui.questionFilter || data._questionFilter || '';
        state.ui.notebookFilter = state.ui.notebookFilter || data._notebookFilter || '';
        state.ui.questionSearch = state.ui.questionSearch || '';
        state.ui.notebookSearch = state.ui.notebookSearch || '';

        return state;
    }

    function loadState() {
        let saved = null;

        try {
            saved = localStorage.getItem(STORAGE);

            if (!saved) {
                saved =
                    localStorage.getItem(LEGACY_STORAGE) ||
            localStorage.getItem('lexstudy_fsh_v30') ||
                    localStorage.getItem('lexstudy_fsh_v20') ||
                    localStorage.getItem('lexstudy_fsh_v19') ||
                    localStorage.getItem('lexstudy_fsh_v18');
            }

            if (typeof saved === 'string') {
                saved = JSON.parse(saved);
            }
        } catch (e) {
            console.error('LexStudy: erro ao carregar dados', e);
            saved = null;
        }

        return normalizeState(saved);
    }

    let state = loadState();

    function saveState() {
        try {
            updateAchievements();
            localStorage.setItem(STORAGE, JSON.stringify(state));
        } catch (e) {
            console.error('LexStudy: erro ao salvar', e);
        }
    }

    /* =========================================================
       ESTATÍSTICAS
       ========================================================= */

    function subjectSessions(subject) {
        return state.sessions.filter(x => x.subject === subject);
    }

    function subjectMinutes(subject) {
        return subjectSessions(subject)
            .reduce((sum, x) => sum + Number(x.minutes || 0), 0);
    }

    function totalStudyMinutes() {
        return state.sessions.reduce(
            (sum, x) => sum + Number(x.minutes || 0),
            0
        );
    }

    function weekStart(date = new Date()) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = day === 0 ? -6 : 1 - day;
        d.setDate(d.getDate() + diff);
        d.setHours(0, 0, 0, 0);
        return d;
    }

    function weeklyMinutes() {
        const start = weekStart();
        const end = new Date(start);
        end.setDate(end.getDate() + 7);

        return state.sessions
            .filter(x => {
                const d = new Date(x.date + 'T00:00:00');
                return d >= start && d < end;
            })
            .reduce((sum, x) => sum + Number(x.minutes || 0), 0);
    }

    function weeklySubjectMinutes(subject) {
        const start = weekStart();
        const end = new Date(start);
        end.setDate(end.getDate() + 7);

        return state.sessions
            .filter(x => {
                const d = new Date(x.date + 'T00:00:00');
                return x.subject === subject && d >= start && d < end;
            })
            .reduce((sum, x) => sum + Number(x.minutes || 0), 0);
    }

    function subjectAttempts(subject) {
        return state.questionAttempts.filter(x => x.subject === subject);
    }

    function subjectAccuracy(subject) {
        const arr = subjectAttempts(subject);
        if (!arr.length) return 0;

        const correct = arr.filter(x => x.correct).length;
        return Math.round((correct / arr.length) * 100);
    }

    function totalAccuracy() {
        if (!state.questionAttempts.length) return 0;

        const correct = state.questionAttempts.filter(x => x.correct).length;

        return Math.round(
            (correct / state.questionAttempts.length) * 100
        );
    }

    function lastStudyDate(subject) {
        const sessions = subjectSessions(subject);

        if (!sessions.length) return null;

        sessions.sort((a, b) =>
            String(b.date).localeCompare(String(a.date))
        );

        return sessions[0].date;
    }

    function pendingReviews(subject = null) {
        const today = todayISO();

        return state.reviews.filter(r => {
            if (subject && r.subject !== subject) return false;
            return r.dueDate <= today && !r.completed;
        });
    }

    function overdueReviews(subject = null) {
        const today = todayISO();

        return state.reviews.filter(r => {
            if (subject && r.subject !== subject) return false;
            return r.dueDate < today && !r.completed;
        });
    }

    /* =========================================================
       XP
       ========================================================= */

    function addXP(amount, reason = '') {
        amount = Number(amount || 0);

        if (amount <= 0) return;

        state.xp += amount;

        const newLevel = Math.floor(state.xp / 500) + 1;

        if (newLevel > state.level) {
            state.level = newLevel;

            setTimeout(() => {
                alert(
                    `🎉 NOVO NÍVEL!\n\nVocê chegou ao nível ${newLevel}.\n\n+${amount} XP`
                );
            }, 100);
        }

        saveState();
    }

    function levelProgress() {
        const current = state.xp % 500;
        return Math.round((current / 500) * 100);
    }

    /* =========================================================
       AGENDA / DATAS
       ========================================================= */

    function addAgendaItem() {
        const title = prompt('Título do compromisso:');
        if (!title) return;

        const date = prompt(
            'Data (AAAA-MM-DD):',
            todayISO()
        );

        if (!date) return;

        const subject = prompt(
            'Matéria:',
            SUBJECTS[0]
        );

        state.agenda.push({
            id: uid('agenda'),
            title,
            date,
            subject,
            type: 'agenda',
            completed: false
        });

        saveState();
        render();
    }

    function addDeadline(type) {
        const title = prompt(
            type === 'exam'
                ? 'Nome da prova:'
                : 'Nome do trabalho/atividade:'
        );

        if (!title) return;

        const subject = prompt(
            'Matéria:',
            SUBJECTS[0]
        );

        if (!subject) return;

        const date = prompt(
            'Data de entrega/prova (AAAA-MM-DD):',
            todayISO()
        );

        if (!date) return;

        const item = {
            id: uid(type),
            title,
            subject,
            date,
            type
        };

        if (type === 'exam') {
            state.plan.exams.push(item);
        } else {
            state.plan.assignments.push(item);
        }

        saveState();
        render();
    }

    function daysUntil(date) {
        const d = parseDate(date);
        if (!d) return null;

        return daysBetween(new Date(), d);
    }

    /* =========================================================
       GRADE
       ========================================================= */

    function todayClass() {
        const day = DAY_NAMES[new Date().getDay()];

        return OFFICIAL_GRADE.find(x => x.day === day) || null;
    }

    function nextClass() {
        const now = new Date();
        const currentDay = now.getDay();

        for (let offset = 0; offset < 7; offset++) {
            const dayIndex = (currentDay + offset) % 7;
            const dayName = DAY_NAMES[dayIndex];

            const classes = OFFICIAL_GRADE.filter(
                x => x.day === dayName
            );

            for (const item of classes) {
                const [h, m] = item.start.split(':').map(Number);
                const d = new Date(now);

                d.setDate(now.getDate() + offset);
                d.setHours(h, m, 0, 0);

                if (d > now) {
                    return {
                        ...item,
                        date: d
                    };
                }
            }
        }

        return null;
    }

    function countdown(date) {
        if (!date) return '';

        const diff = date - new Date();

        if (diff <= 0) return 'agora';

        const totalMin = Math.floor(diff / 60000);
        const days = Math.floor(totalMin / 1440);
        const hours = Math.floor((totalMin % 1440) / 60);
        const mins = totalMin % 60;

        if (days > 0) return `${days}d ${hours}h`;
        if (hours > 0) return `${hours}h ${mins}min`;

        return `${mins}min`;
    }

    /* =========================================================
       RECOMENDAÇÃO DE ESTUDO
       ========================================================= */

    function getStudyRecommendation() {
        const today = todayClass();

        const scored = SUBJECTS.map(subject => {
            const weeklyTarget =
                Number(state.plan.weeklySubjectMinutes[subject]) || 0;

            const studied = weeklySubjectMinutes(subject);

            const deficit = Math.max(
                0,
                weeklyTarget - studied
            );

            const last = lastStudyDate(subject);

            let gap = last
                ? daysBetween(last, new Date())
                : 30;

            const reviewCount = pendingReviews(subject).length;
            const errors = state.questionAttempts.filter(
                x => x.subject === subject && !x.correct
            ).length;

            let score = 0;

            score += deficit * 1.5;
            score += gap * 5;
            score += reviewCount * 15;
            score += errors * 2;

            if (today && today.subject === subject) {
                score += 20;
            }

            return {
                subject,
                target: weeklyTarget,
                studied,
                deficit,
                gap,
                reviewCount,
                errors,
                score
            };
        });

        scored.sort((a, b) => b.score - a.score);

        return scored[0];
    }

    function recommendationReasons(item) {
        const reasons = [];

        if (item.deficit > 0) {
            reasons.push(
                `${item.deficit} min abaixo da meta semanal`
            );
        }

        if (item.gap >= 3) {
            reasons.push(
                `${item.gap} dias desde o último estudo`
            );
        }

        if (item.reviewCount > 0) {
            reasons.push(
                `${item.reviewCount} revisão(ões) pendente(s)`
            );
        }

        if (item.errors > 0) {
            reasons.push(
                `${item.errors} questão(ões) errada(s)`
            );
        }

        const today = todayClass();

        if (today && today.subject === item.subject) {
            reasons.push('há aula dessa matéria hoje');
        }

        if (!reasons.length) {
            reasons.push('boa opção para manter sua rotina');
        }

        return reasons;
    }

    /* =========================================================
       CRONÔMETRO
       ========================================================= */

    let timerInterval = null;

    function timerSeconds() {
        if (!state.studyTimer.active) {
            return state.studyTimer.elapsedSeconds || 0;
        }

        if (state.studyTimer.paused) {
            return state.studyTimer.elapsedSeconds || 0;
        }

        const start = Number(state.studyTimer.startedAt || Date.now());
        const elapsed = Number(state.studyTimer.elapsedSeconds || 0) +
            Math.floor((Date.now() - start) / 1000);

        if (state.studyTimer.phase === 'break') {
            return Math.max(0, Number(state.studyTimer.breakMinutes || 5) * 60 - elapsed);
        }
        return elapsed;
    }

    function startTimer(subject, targetMinutes = 30) {
        if (state.studyTimer.active) {
            alert('Já existe um estudo em andamento.');
            return;
        }

        state.studyTimer = {
            active: true,
            paused: false,
            subject,
            startedAt: Date.now(),
            elapsedSeconds: 0,
            targetMinutes: Number(targetMinutes) || 30,
            mode: 'custom',
            phase: 'study',
            breakMinutes: 0,
            cycle: 0
        };

        saveState();

        openStudyOverlay();

        timerInterval = setInterval(() => {
            updateTimerDisplay();
        }, 1000);
    }

    function pauseTimer() {
        if (!state.studyTimer.active) return;

        if (!state.studyTimer.paused) {
            const current = timerSeconds();
            state.studyTimer.elapsedSeconds = timerIsPomodoroBreak()
                ? (Number(state.studyTimer.breakMinutes || 5) * 60 - current)
                : current;
            state.studyTimer.paused = true;
            state.studyTimer.startedAt = null;
        } else {
            state.studyTimer.startedAt = Date.now();
            state.studyTimer.paused = false;
        }

        saveState();
        updateTimerDisplay();
    }

    function finishTimer() {
        if (!state.studyTimer.active) return;

        const seconds = timerSeconds();
        const minutes = Math.floor(seconds / 60);

        const subject = state.studyTimer.subject;

        if (minutes < 1) {
            if (
                !confirm(
                    'O estudo teve menos de 1 minuto.\nDeseja finalizar mesmo assim?'
                )
            ) {
                return;
            }
        }

        const finalMinutes = Math.max(1, minutes);

        state.sessions.push({
            id: uid('session'),
            subject,
            date: todayISO(),
            minutes: finalMinutes,
            seconds,
            createdAt: new Date().toISOString()
        });

        addXP(finalMinutes, 'tempo de estudo');

        if (minutes >= 10) {
            createReview(subject, 1);
        }

        state.studyTimer = {
            active: false,
            paused: false,
            subject: '',
            startedAt: null,
            elapsedSeconds: 0,
            targetMinutes: 30,
            mode: 'custom',
            phase: 'study',
            breakMinutes: 0,
            cycle: 0
        };

        saveState();

        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        closeStudyOverlay();

        alert(
            `✅ Estudo registrado!\n\n` +
            `${subject}\n` +
            `${finalMinutes} minutos\n` +
            `+${finalMinutes} XP`
        );

        render();
    }

    function cancelTimer() {
        if (!state.studyTimer.active) return;

        if (
            !confirm(
                'Deseja cancelar este estudo?\nO tempo não será registrado.'
            )
        ) {
            return;
        }

        state.studyTimer = {
            active: false,
            paused: false,
            subject: '',
            startedAt: null,
            elapsedSeconds: 0,
            targetMinutes: 30,
            mode: 'custom',
            phase: 'study',
            breakMinutes: 0,
            cycle: 0
        };

        saveState();

        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        closeStudyOverlay();
    }

    function openStudyOverlay() {
        let overlay = document.getElementById('lex-study-overlay');

        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'lex-study-overlay';

            overlay.innerHTML = `
                <div class="lex-study-box">
                    <div class="lex-study-label">MODO ESTUDO</div>
                    <h2 id="lex-timer-subject"></h2>

                    <div id="lex-timer-time">00:00</div>

                    <div class="lex-progress">
                        <div id="lex-timer-progress"></div>
                    </div>

                    <div class="lex-timer-target" id="lex-timer-target"></div>

                    <div class="lex-study-actions">
                        <button id="lex-pause-timer">⏸ PAUSAR</button>
                        <button id="lex-finish-timer">✓ FINALIZAR</button>
                    </div>

                    <button class="lex-cancel-study" id="lex-cancel-timer">
                        Cancelar estudo
                    </button>
                </div>
            `;

            document.body.appendChild(overlay);

            document
                .getElementById('lex-pause-timer')
                .onclick = pauseTimer;

            document
                .getElementById('lex-finish-timer')
                .onclick = finishTimer;

            document
                .getElementById('lex-cancel-timer')
                .onclick = cancelTimer;
        }

        overlay.style.display = 'flex';

        updateTimerDisplay();
    }

    function closeStudyOverlay() {
        const overlay =
            document.getElementById('lex-study-overlay');

        if (overlay) {
            overlay.style.display = 'none';
        }
    }

    function updateTimerDisplay() {
        const time =
            document.getElementById('lex-timer-time');

        if (!time) return;

        const seconds = timerSeconds();

        if (timerIsPomodoroBreak() && seconds <= 0) {
            finishPomodoroBreak();
            return;
        }

        time.textContent = formatTime(seconds);

        const subject =
            document.getElementById('lex-timer-subject');

        if (subject) {
            subject.textContent =
                timerIsPomodoroBreak()
                    ? `Pausa • ${state.studyTimer.subject}`
                    : state.studyTimer.subject;
        }

        const target =
            timerIsPomodoroBreak()
                ? Number(state.studyTimer.breakMinutes || 5) * 60
                : Number(state.studyTimer.targetMinutes || 30) * 60;

        const progress =
            Math.min(100, Math.round((seconds / target) * 100));

        const bar =
            document.getElementById('lex-timer-progress');

        if (bar) {
            bar.style.width = progress + '%';
        }

        const targetEl =
            document.getElementById('lex-timer-target');

        if (targetEl) {
            targetEl.textContent = timerIsPomodoroBreak()
                ? `Pausa: ${state.studyTimer.breakMinutes} min · ${100 - progress}% restante`
                : `Meta: ${state.studyTimer.targetMinutes} min · ${progress}%`;
        }

        const pause =
            document.getElementById('lex-pause-timer');

        if (pause) {
            pause.textContent =
                state.studyTimer.paused
                    ? '▶ CONTINUAR'
                    : '⏸ PAUSAR';
        }
    }

    /* =========================================================
       REVISÕES
       ========================================================= */

    function createReview(subject, days = 1, topic = '') {
        const interval = Number(days || 1);
        const due = new Date();

        due.setDate(due.getDate() + interval);
        const dueDate = dateISO(due);

        const duplicate = state.reviews.some(r =>
            !r.completed &&
            r.subject === subject &&
            r.dueDate === dueDate &&
            String(r.topic || '') === String(topic || '')
        );

        if (duplicate) return false;

        state.reviews.push({
            id: uid('review'),
            subject,
            topic,
            createdDate: todayISO(),
            dueDate,
            interval,
            completed: false
        });

        saveState();
        return true;
    }

    function createReviewForSubject(subject) {
        const intervals = [1, 3, 7, 15];
        let created = 0;

        intervals.forEach(days => {
            if (createReview(subject, days)) created++;
        });

        alert(
            `🔁 Ciclo de revisão: ${subject}\n\n` +
            `${created} revisão(ões) nova(s) criada(s).\n` +
            `Intervalos: 1, 3, 7 e 15 dias.\n\n` +
            (created < intervals.length
                ? 'As revisões que já existiam não foram duplicadas.'
                : '')
        );

        render();
    }

    function completeReview(id) {
        const review = state.reviews.find(
            x => x.id === id
        );

        if (!review) return;

        review.completed = true;
        review.completedDate = todayISO();

        addXP(20, 'revisão');

        saveState();
        render();
    }

       ========================================================= */

    let simulation = null;

    function startSimulation() {
        if (!state.questions.length) {
            alert('Você ainda não possui questões cadastradas.');
            return;
        }

        const size = Number(
            prompt(
                'Quantidade de questões:',
                String(state.ui.simulationSize || 10)
            )
        );

        if (!size || size < 1) return;

        const subject = prompt(
            'Matéria ou deixe vazio para todas:',
            ''
        );

        let pool = state.questions.slice();

        if (subject) {
            pool = pool.filter(
                q =>
                    q.subject.toLowerCase() ===
                    subject.toLowerCase()
            );
        }

        if (!pool.length) {
            alert('Nenhuma questão encontrada.');
            return;
        }

        pool.sort(() => Math.random() - 0.5);

        const selected =
            pool.slice(0, Math.min(size, pool.length));

        simulation = {
            id: uid('sim'),
            questions: selected,
            index: 0,
            correct: 0,
            answers: [],
            startedAt: Date.now()
        };

        render();
    }

    function answerSimulation(answer) {
        if (!simulation) return;

        const q =
            simulation.questions[simulation.index];

        if (!q) return;

        const correct =
            answer.toUpperCase() ===
            q.correct.toUpperCase();

        simulation.answers.push({
            questionId: q.id,
            answer,
            correct
        });

        if (correct) {
            simulation.correct++;
        }

        simulation.index++;

        if (
            simulation.index >=
            simulation.questions.length
        ) {
            finishSimulation();
        } else {
            render();
        }
    }

    function finishSimulation() {
        if (!simulation) return;

        const total =
            simulation.questions.length;

        const correct =
            simulation.correct;

        const accuracy =
            Math.round((correct / total) * 100);

        const wrong =
            total - correct;

        const simulationQuestions =
            simulation.questions.map(q => q.id);

        simulationQuestions.forEach(id => {
            const answer =
                simulation.answers.find(
                    x => x.questionId === id
                );

            const q =
                state.questions.find(x => x.id === id);

            if (!q || !answer) return;

            state.questionAttempts.push({
                id: uid('attempt'),
                questionId: id,
                subject: q.subject,
                answer: answer.answer,
                correct: answer.correct,
                simulation: true,
                date: todayISO(),
                timestamp: new Date().toISOString()
            });
        });

        addXP(correct * 10 + wrong * 3, 'simulado');

        saveState();

        alert(
            `🏆 SIMULADO FINALIZADO!\n\n` +
            `Questões: ${total}\n` +
            `Acertos: ${correct}\n` +
            `Erros: ${wrong}\n` +
            `Aproveitamento: ${accuracy}%`
        );

        simulation = null;

        render();
    }

    function studyStreak() {
        const dates = [...new Set(state.sessions.map(x => x.date))]
            .sort((a, b) => String(b).localeCompare(String(a)));
        if (!dates.length) return 0;
        let streak = 0;
        let cursor = parseDate(todayISO());
        for (const date of dates) {
            const d = parseDate(date);
            if (!d) continue;
            const diff = daysBetween(d, cursor);
            if (diff === 0) {
                streak++;
                cursor.setDate(cursor.getDate() - 1);
            } else if (diff > 0) {
                break;
            }
        }
        return streak;
    }

    function updateAchievements() {
        const rules = [
            ['first-session', 'Primeiro passo', 'Conclua sua primeira sessão de estudo.', 20, totalStudyMinutes() >= 1],
            ['five-hours', '5 horas de estudo', 'Acumule 300 minutos de estudo.', 50, totalStudyMinutes() >= 300],
            ['ten-hours', '10 horas de estudo', 'Acumule 600 minutos de estudo.', 100, totalStudyMinutes() >= 600],
            ['ten-questions', 'Prática ativa', 'Responda 10 questões.', 50, state.questionAttempts.length >= 10],
            ['perfect-ten', '10 acertos', 'Acerte 10 questões.', 75, state.questionAttempts.filter(x => x.correct).length >= 10],
            ['streak-7', 'Semana consistente', 'Mantenha uma sequência de 7 dias.', 100, studyStreak() >= 7],
            ['ten-notes', 'Caderno cheio', 'Crie 10 anotações.', 50, state.notebookEntries.length >= 10],
            ['five-flashcards', 'Memória ativa', 'Crie 5 flashcards.', 40, state.flashcards.length >= 5]
        ];
        for (const [id, title, description, xp, condition] of rules) {
            if (condition && !state.achievements.some(a => a.id === id)) {
                state.achievements.push({
                    id, title, description, xp,
                    unlockedAt: new Date().toISOString()
                });
                state.xp += xp;
                state.level = Math.floor(state.xp / 500) + 1;
            }
        }
    }

    function pomodoroOptions() {
        return {
            '25/5': { focus: 25, break: 5, label: 'Pomodoro 25/5' },
            '50/10': { focus: 50, break: 10, label: 'Foco 50/10' },
            'custom': null
        };
    }

    function startPomodoro(subject, mode = state.ui.pomodoroMode, forcedFocus = null, forcedBreak = null) {
        const options = pomodoroOptions();
        let focus = forcedFocus || options[mode]?.focus || 0;
        let breakMinutes = forcedBreak || options[mode]?.break || 0;
        if (!focus) {
            focus = Number(prompt('Tempo de foco em minutos:', '30'));
            breakMinutes = Number(prompt('Tempo de pausa em minutos:', '5'));
        }
        if (!focus || focus < 1 || !breakMinutes || breakMinutes < 1) return;
        state.ui.pomodoroMode = mode;
        state.studyTimer = {
            active: true,
            paused: false,
            subject,
            startedAt: Date.now(),
            elapsedSeconds: 0,
            targetMinutes: focus,
            mode,
            phase: 'study',
            breakMinutes,
            cycle: Number(state.studyTimer.cycle || 0) + 1
        };
        saveState();
        openStudyOverlay();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => updateTimerDisplay(), 1000);
    }

    function timerIsPomodoroBreak() {
        return state.studyTimer.active && state.studyTimer.phase === 'break';
    }

    function startPomodoroBreak() {
        const breakMinutes = Number(state.studyTimer.breakMinutes || 5);
        state.studyTimer.phase = 'break';
        state.studyTimer.paused = false;
        state.studyTimer.startedAt = Date.now();
        state.studyTimer.elapsedSeconds = 0;
        state.pomodoroStats.breakMinutes += breakMinutes;

    function reviewFlashcard(id, known) {

        cardItem.reviews = Number(cardItem.reviews || 0) + 1;
        if (known) {
            cardItem.streak = Number(cardItem.streak || 0) + 1;
            const idx = Math.min(cardItem.streak, intervals.length) - 1;
            cardItem.interval = intervals[Math.max(0, idx)];
            const due = new Date();
            due.setDate(due.getDate() + cardItem.interval);
            cardItem.dueDate = dateISO(due);
            addXP(8, 'flashcard dominado');
        } else {

            cardItem.interval = 1;

        state.ui.flashcardReveal[id] = false;
        saveState();

    function exportBackup() {
        const payload = {
            app: 'LexStudy FSH',
            version: '4.0.0',
            exportedAt: new Date().toISOString(),
            state
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `LexStudy_FSH_V4.0_Backup_${todayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function importBackup() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json,.json';
        input.onchange = async () => {
            const file = input.files?.[0];
            if (!file) return;
            try {
                const parsed = JSON.parse(await file.text());
                const incoming = parsed.state || parsed;
                if (!incoming || typeof incoming !== 'object') throw new Error('Formato inválido');
                if (!confirm('Importar este backup substituirá os dados atuais. Continuar?')) return;
                state = normalizeState(incoming);
                saveState();
                applyTheme();
                render();
                alert('Backup restaurado com sucesso! ✅');
            } catch (e) {
                console.error(e);
                alert('Não foi possível importar o backup.');
            }
        };
        input.click();
    }

    function globalSearchResults(query) {

        if (!q) return [];
        const results = [];
        SUBJECTS.forEach(subject => {
            if (subject.toLowerCase().includes(q)) results.push({ type: 'Matéria', title: subject, text: 'Grade e planejamento' });
        });
        state.notebookEntries.forEach(x => {
            if (`${x.subject} ${x.title} ${x.content}`.toLowerCase().includes(q))

        });
        state.summaries.forEach(x => {

        });
        state.questions.forEach(x => {

        const d = calendarMonthDate();

        saveState();
        render();

    function calendarEvents() {
        return [
            ...state.agenda.map(x => ({ ...x, eventType: 'Agenda' })),
            ...state.plan.exams.map(x => ({ ...x, eventType: 'Prova' })),
            ...state.plan.assignments.map(x => ({ ...x, eventType: 'Atividade' })),
            ...state.reviews.filter(x => !x.completed).map(x => ({
                ...x, title: `Revisão: ${x.subject}`, eventType: 'Revisão'
            }))
        ];
    }

    function renderCalendar() {
        const d = calendarMonthDate();
        const year = d.getFullYear();
        const month = d.getMonth();
        const first = new Date(year, month, 1);
        const last = new Date(year, month + 1, 0);
        const startDay = (first.getDay() + 6) % 7;
        const cells = [];
        for (let i = 0; i < startDay; i++) cells.push('<div class="lex-calendar-cell muted"></div>');
        const events = calendarEvents();
        for (let day = 1; day <= last.getDate(); day++) {
            const date = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayEvents = events.filter(x => x.date === date || x.dueDate === date);
            cells.push(`
                <div class="lex-calendar-cell ${date === todayISO() ? 'today' : ''}">
                    <strong>${day}</strong>
                    ${dayEvents.slice(0, 3).map(x => `<span title="${escapeHTML(x.title || x.subject || '')}">${escapeHTML((x.title || x.subject || x.eventType).slice(0, 22))}</span>`).join('')}
                    ${dayEvents.length > 3 ? `<small>+${dayEvents.length - 3} eventos</small>` : ''}
                </div>
            `);
        }
        return `
            <div class="lex-page-title">
                <div>
                    <span class="lex-kicker">ORGANIZAÇÃO</span>
                    <h1>Calendário</h1>
                    <p>Visualize aulas, provas, atividades e revisões.</p>
                </div>
                <div class="lex-actions">
                    ${button('← Mês anterior', 'calendar-prev')}
                    ${button('Hoje', 'calendar-today')}
                    ${button('Próximo mês →', 'calendar-next')}
                </div>
            </div>
            ${card(`${String(month + 1).padStart(2, '0')}/${year}`, `
                <div class="lex-calendar-week">
                    ${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x => `<b>${x}</b>`).join('')}
                </div>
                <div class="lex-calendar-grid">${cells.join('')}</div>
            `)}
        `;
    }

        return `

    function renderDeadline(item) {
        const days = daysUntil(item.date);

        let status = '';

        if (days === null) {
            status = '';
        } else if (days < 0) {
            status = `<span class="lex-danger">Atrasado</span>`;
        } else if (days === 0) {
            status = `<span class="lex-warning">Hoje</span>`;
        } else {
            status = `<span>Faltam ${days} dia(s)</span>`;
        }

        return `
            <div class="lex-list-item">
                <strong>${escapeHTML(item.title)}</strong>
                <small>${escapeHTML(item.subject)}</small>
                <small>${item.date} • ${status}</small>
            </div>
        `;
    }

    /* =========================================================
       QUESTÕES
       ========================================================= */

    function renderQuestions(filterSubject = state.ui.questionFilter || '') {
        if (simulation) {
            return renderSimulation();
        }

        let questions = state.questions.slice();
        const search = String(state.ui.questionSearch || '').trim().toLowerCase();

        if (filterSubject) {
            questions =
                questions.filter(
                    q => q.subject === filterSubject
                );
        }

        if (state.ui.questionMode === 'wrong') {
            questions = questions.filter(q => {
                return questionStats(q).wrong > 0;
            });
        }

        if (state.ui.questionMode === 'important') {
            questions = questions.filter(q => q.important);
        }

        if (search) {
            questions = questions.filter(q => {
                const haystack = `${q.title || ''} ${q.statement || ''} ${q.subject || ''} ${q.explanation || ''}`.toLowerCase();
                return haystack.includes(search);
            });
        }

        return `
            <div class="lex-page-title">
                <div>
                    <span class="lex-kicker">QUESTÕES</span>
                    <h1>Banco de questões</h1>
                    <p>Pratique, registre seus erros e acompanhe sua evolução.</p>

                        'start-simulation'
                    )}

                <button
                    class="lex-filter ${state.ui.questionMode === 'all' ? 'active' : ''}"

                </button>

                <button
                    class="lex-filter ${state.ui.questionMode === 'wrong' ? 'active' : ''}"

                </button>

                <button
                    class="lex-filter ${state.ui.questionMode === 'important' ? 'active' : ''}"
                    data-action="question-filter:important">
                    ⭐ Importantes
                </button>
            </div>

            ${card(
                '📊 Estatísticas',
                `
                    <div class="lex-mini-stats">
                        <span>${state.questions.length} questões</span>
                        <span>${state.questionAttempts.length} tentativas</span>
                        <span>${totalAccuracy()}% acerto</span>

                            </div>
                        </div>

    function renderQuestion(q) {

        return `

            .forEach(btn => {

                    'active',
                    btn.dataset.tab === state.ui.tab

    function bindActions() {
        document
            .querySelectorAll('[data-action]')
            .forEach(el => {
                el.addEventListener('click', () => {
                    handleAction(
                        el.getAttribute('data-action')
                    );
                });
            });

        const notebookFilter =
            document.getElementById('lex-notebook-filter');

        if (notebookFilter) {
            notebookFilter.addEventListener('change', () => {
                state.ui.notebookFilter = notebookFilter.value;
                saveState();
                render();
            });
        }

        const notebookSearch = document.getElementById('lex-notebook-search');
        if (notebookSearch) {
            notebookSearch.addEventListener('input', () => {
                state.ui.notebookSearch = notebookSearch.value;
                saveState();
                render();
                const el = document.getElementById('lex-notebook-search');
                if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
            });
        }

        const questionFilter = document.getElementById('lex-question-filter');
        if (questionFilter) {
            questionFilter.addEventListener('change', () => {
                state.ui.questionFilter = questionFilter.value;
                saveState();
                render();
            });
        }

        const globalSearch = document.getElementById('lex-global-search');
        if (globalSearch) {
            globalSearch.addEventListener('input', () => {
                state.ui.globalSearch = globalSearch.value;
                saveState();
                render();
                const el = document.getElementById('lex-global-search');
                if (el) {
                    el.focus();
                    el.setSelectionRange(el.value.length, el.value.length);
                }
            });
        }

        const questionSearch = document.getElementById('lex-question-search');
        if (questionSearch) {
            questionSearch.addEventListener('input', () => {
                state.ui.questionSearch = questionSearch.value;
                saveState();
                render();
                const el = document.getElementById('lex-question-search');
                if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
            });
        }
    }

    function handleAction(action) {
        if (!action) return;

        const parts = action.split(':');
        const type = parts.shift();
        const value = parts.join(':');

        switch (type) {
            case 'edit-goal':
                editWeeklyGoal();
                break;

            case 'start-study': {
                const subject = decodeURIComponent(value);
                if (state.ui.pomodoroMode === 'custom') {
                    const target = Number(prompt('Tempo de foco em minutos:', '30'));
                    if (!target || target < 1) return;
                    const breakMinutes = Number(prompt('Tempo de pausa em minutos:', '5'));
                    if (!breakMinutes || breakMinutes < 1) return;
                    startPomodoro(subject, 'custom', target, breakMinutes);
                } else {
                    startPomodoro(subject, state.ui.pomodoroMode);
                }
                break;
            }

            case 'open-notebook':
                state.ui.tab = 'notebook';
                state.ui.notebookFilter =
                    decodeURIComponent(value);
                saveState();
                render();
                break;

            case 'open-questions':
                state.ui.tab = 'questions';
                state.ui.questionFilter =
                    decodeURIComponent(value);
                saveState();
                render();
                break;

            case 'add-note':
                addNotebookEntry();
                break;

            case 'delete-note':
                deleteNotebook(value);
                break;

            case 'add-question':
                addQuestion();
                break;

            case 'delete-question':
                deleteQuestion(value);
                break;

            case 'important-question':
                toggleImportantQuestion(value);
                break;

            case 'answer-question': {
                const questionId = parts.shift();
                const answer = parts.shift();

                answerQuestion(
                    questionId,
                    answer
                );

                break;
            }

            case 'question-filter':
                state.ui.questionMode = value;
                saveState();
                render();
                break;

            case 'start-simulation':
                startSimulation();
                break;

            case 'simulation-answer':
                answerSimulation(value);
                break;

            case 'complete-review':
                completeReview(value);
                break;

            case 'create-reviews':
                createReviewForSubject(
                    decodeURIComponent(value)
                );
                break;

            case 'add-agenda':
                addAgendaItem();
                break;

            case 'add-exam':
                addDeadline('exam');
                break;

            case 'add-assignment':
                addDeadline('assignment');
                break;

            case 'edit-target':
                editSubjectTarget(
                    decodeURIComponent(value)
                );
                break;

            case 'start-pomodoro': {
                const subject = decodeURIComponent(value || '');
                startPomodoro(subject, state.ui.pomodoroMode);
                break;
            }

            case 'add-flashcard':
                addFlashcard();
                break;

            case 'toggle-flashcard':
                toggleFlashcard(value);
                break;

            case 'review-flashcard': {
                const id = parts.shift();
                const known = parts.shift() === '1';
                reviewFlashcard(id, known);
                break;
            }

            case 'delete-flashcard':
                deleteFlashcard(value);
                break;

            case 'flashcard-filter':
                state.ui.flashcardFilter = value;
                saveState();
                render();
                break;

            case 'add-summary':
                addSummary();
                break;

            case 'delete-summary':
                deleteSummary(value);
                break;

            case 'calendar-prev':
                shiftCalendar(-1);
                break;

            case 'calendar-next':
                shiftCalendar(1);
                break;

            case 'calendar-today':
                state.ui.calendarMonth = todayISO().slice(0, 7);
                saveState();
                render();
                break;

            case 'export-backup':
                exportBackup();
                break;

            case 'import-backup':
                importBackup();
                break;

            case 'toggle-dark':
                toggleDarkMode();
                break;

            case 'reset-data':
                resetData();
                break;

            case 'set-pomodoro':
                state.ui.pomodoroMode = value;
                saveState();
                render();
                break;

            case 'library-note': {
                const title =
                    decodeURIComponent(value);

                const content =
                    prompt(
                        `Anotação para ${title}:`
                    );

                if (!content) return;

                state.notebookEntries.push({
                    id: uid('note'),
                    subject: title,
                    title: 'Anotação jurídica',
                    content,
                    important: false,
                    createdAt: new Date().toISOString()
                });

                addXP(10, 'anotação jurídica');

                saveState();
                render();

                break;
            }
        }
    }

    function createFloatingButton() {
        if (document.getElementById('lex-floating-button')) {
            return;
        }

        const btn = document.createElement('button');

        btn.id = 'lex-floating-button';
        btn.textContent = 'LexStudy';

        btn.style.right =
            `${state.settings.buttonPosition.right}px`;

        btn.style.top =
            `${state.settings.buttonPosition.top}px`;

        document.body.appendChild(btn);

        btn.addEventListener('click', () => {
            const app =
                document.getElementById('lexstudy-app');

            if (!app) {
                createApp();
                render();
                return;
            }

            app.classList.toggle('lex-hidden');
        });

        let dragging = false;
        let offsetX = 0;
        let offsetY = 0;

        btn.addEventListener(
            'mousedown',
            e => {
                dragging = true;

                const rect =
                    btn.getBoundingClientRect();

                offsetX =
                    e.clientX - rect.left;

                offsetY =
                    e.clientY - rect.top;

                btn.style.cursor = 'grabbing';
            }
        );

        document.addEventListener(
            'mousemove',
            e => {
                if (!dragging) return;

                const top =
                    Math.max(
                        10,
                        Math.min(
                            window.innerHeight - 45,
                            e.clientY - offsetY
                        )
                    );

                const right =
                    Math.max(
                        10,
                        window.innerWidth -
                        (e.clientX - offsetX) -
                        btn.offsetWidth
                    );

                btn.style.top = top + 'px';
                btn.style.right = right + 'px';

                state.settings.buttonPosition = {
                    top,
                    right
                };

                saveState();
            }
        );

        document.addEventListener(
            'mouseup',
            () => {
                dragging = false;
                btn.style.cursor = 'grab';
            }
        );
    }

        .lex-btn {

        }

        .lex-danger {

        .lex-grade-grid {

            font-weight: 800;

        .lex-grade-card h3 {

            margin: 0 0 13px;

        .lex-target-list {

        .lex-target-item strong {
            display: block;
            font-size: 13px;
        }

        .lex-target-item small {
            color: #64748b;
        }

        .lex-target-item > div:last-child {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lex-list {
            margin-top: 15px;
        }

        .lex-list-item {
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lex-list-item strong {
            font-size: 13px;
        }

        .lex-list-item small {
            color: #64748b;
        }

        .lex-filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 18px;

            min-width: 260px;

        .lex-filter-bar input,
        .lex-filter-bar select {
            border: 1px solid #dbe2ea;

            background: #fff;
            padding: 10px 12px;
            color: #172033;
            outline: none;
        }

        .lex-filter-bar input:focus,
        .lex-filter-bar select:focus {
            border-color: #64748b;
            box-shadow: 0 0 0 3px rgba(100,116,139,.12);
        }

        .lex-filter-bar select {
            min-width: 250px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            padding: 9px;
            background: #fff;
        }

        .lex-filter {
            border: 1px solid #d1d5db;
            background: #fff;
            border-radius: 9px;
            padding: 9px 12px;
            cursor: pointer;
        }

        .lex-filter.active {
            background: #111827;
            color: #fff;
            border-color: #111827;
        }

        .lex-note-grid,
        .lex-library-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .lex-note {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 18px;
        }

        .lex-note > small {
            color: #64748b;
        }

        .lex-note h3 {
            margin: 7px 0;
        }

        .lex-note p {
            color: #475569;
            white-space: pre-wrap;
            line-height: 1.55;
        }

        .lex-note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
        }

        .lex-link {
            border: 0;
            background: transparent;
            color: #dc2626;
            cursor: pointer;
            font-weight: 700;
        }

        .lex-important {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            color: #ca8a04;
            margin-bottom: 8px;
        }

        .lex-question-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lex-question {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 20px;
        }

        .lex-question-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .lex-question-subject {
            display: inline-block;
            font-size: 10px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .lex-question h3 {
            margin: 0;
        }

        .lex-question-statement {
            line-height: 1.6;
            color: #334155;
            white-space: pre-wrap;
        }

        .lex-alternatives {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }

        .lex-alternatives button {
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 10px;
            padding: 11px;

            gap: 10px;
            text-align: left;
            cursor: pointer;
            color: #172033;
        }

        .lex-alternatives button:hover {
            border-color: #111827;
            background: #fff;
        }

        .lex-alternatives strong {
            min-width: 20px;
        }

        .lex-question-bottom {
            display: flex;
            gap: 15px;
            margin-top: 13px;
            color: #64748b;
            font-size: 11px;
        }

        .lex-question-tools {
            display: flex;
            gap: 4px;
        }

        .lex-icon-btn {
            border: 0;
            background: #f8fafc;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            cursor: pointer;
        }

        .lex-mini-stats {
            display: flex;
            gap: 20px;
            color: #64748b;
            flex-wrap: wrap;
        }

        .lex-review-list {
            display: flex;
            flex-direction: column;
        }

        .lex-review {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .lex-review > div {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lex-review small {
            color: #64748b;
        }

        .lex-review.overdue {
            border-left: 3px solid #dc2626;
            padding-left: 12px;
        }

        .lex-subject-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .lex-agenda-list {
            display: flex;
            flex-direction: column;
        }

        .lex-agenda-item {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 20px;
            padding: 15px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .lex-agenda-date {
            font-weight: 800;
        }

        .lex-agenda-item div:nth-child(2) {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lex-agenda-item small,
        .lex-agenda-item span {
            color: #64748b;
        }

        .lex-history {
            display: flex;
            flex-direction: column;
        }

        .lex-history-row {
            display: grid;
            grid-template-columns: 120px 1fr 100px;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .lex-library-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 20px;
        }

        .lex-library-card > span {
            font-size: 28px;
        }

        .lex-library-card h3 {
            margin: 12px 0 6px;
        }

        .lex-library-card p {
            color: #64748b;
            line-height: 1.5;
            min-height: 45px;
        }

        .lex-empty {
            color: #94a3b8;
            padding: 20px 0;
        }


        /* V4 — COMPONENTES NOVOS */

        .lex-global-search {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #dbe2ea;
            border-radius: 12px;
            padding: 13px 15px;
            font-size: 15px;
        }

        .lex-calendar-week,
        .lex-calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
        }

        .lex-calendar-week {
            margin-bottom: 8px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }

        .lex-calendar-cell {
            min-height: 105px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 8px;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-sizing: border-box;
        }

        .lex-calendar-cell.today {
            border-color: #111827;
            box-shadow: 0 0 0 2px rgba(17,24,39,.08);
        }

        .lex-calendar-cell.muted {
            opacity: .35;
        }

        .lex-calendar-cell span {
            font-size: 10px;
            background: #f1f5f9;
            padding: 4px 5px;
            border-radius: 5px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

        .lex-achievement-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0,1fr));
            gap: 16px;
        }

        .lex-achievement {
            border: 1px solid #e5e7eb;
            background: #fff;
            border-radius: 16px;
            padding: 18px;

        .lex-flashcard h3 {
            min-height: 55px;
        }

        .lex-flashcard-answer {
            padding: 14px;
            border-radius: 10px;
            background: #f8fafc;
            margin: 12px 0;
            white-space: pre-wrap;
        }

        .lex-flashcard-answer {
            border: 1px solid #dbeafe;
        }

        .lex-search-results {
            display: flex;
            flex-direction: column;
        }

        .lex-search-result {
            display: grid;
            grid-template-columns: 100px 1fr 1fr;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .lex-search-result span {
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .lex-search-result small {
            color: #64748b;
        }

        .lex-chart {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lex-chart-row {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) 2fr;
            align-items: center;
            gap: 18px;
        }

        .lex-chart-row > div:first-child {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lex-chart-row small {
            color: #64748b;
        }

        .lex-chart-track {
            height: 12px;
            background: #eef2f7;
            border-radius: 999px;
            overflow: hidden;
        }

        .lex-chart-track span {
            display: block;
            height: 100%;
            background: #111827;
            border-radius: inherit;
        }

        .lex-achievement {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .lex-achievement span {
            font-size: 28px;
        }

        .lex-achievement small {
            color: #64748b;
            min-height: 36px;
        }

        .lex-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .lex-btn.danger {
            color: #b91c1c;
        }

        #lexstudy-app.lex-dark {
            background: #0f172a;
            color: #e5e7eb;
        }

        #lexstudy-app.lex-dark .lex-main,
        #lexstudy-app.lex-dark .lex-page-title h1 {
            color: #e5e7eb;
        }

        #lexstudy-app.lex-dark .lex-card,
        #lexstudy-app.lex-dark .lex-stat,
        #lexstudy-app.lex-dark .lex-note,
        #lexstudy-app.lex-dark .lex-question,
        #lexstudy-app.lex-dark .lex-library-card,
        #lexstudy-app.lex-dark .lex-flashcard,
        #lexstudy-app.lex-dark .lex-achievement,
        #lexstudy-app.lex-dark .lex-calendar-cell,
        #lexstudy-app.lex-dark .lex-study-box {
            background: #111827;
            border-color: #263244;
            color: #e5e7eb;
        }

        #lexstudy-app.lex-dark .lex-highlight strong {
            color: #fff;
        }

        #lexstudy-app.lex-dark .lex-stat span,
        #lexstudy-app.lex-dark .lex-stat small,
        #lexstudy-app.lex-dark .lex-page-title p,
        #lexstudy-app.lex-dark .lex-note p,
        #lexstudy-app.lex-dark .lex-question-statement,
        #lexstudy-app.lex-dark .lex-highlight span,
        #lexstudy-app.lex-dark .lex-highlight small,
        #lexstudy-app.lex-dark .lex-chart-row small,
        #lexstudy-app.lex-dark .lex-search-result small {
            color: #94a3b8;
        }

        #lexstudy-app.lex-dark input,
        #lexstudy-app.lex-dark select,
        #lexstudy-app.lex-dark .lex-filter,

            background: #0f172a;

        #lexstudy-app.lex-dark .lex-chart-track {
            background: #263244;
        }

        @media (max-width: 900px) {
            .lex-flashcard-grid,
            .lex-achievement-grid {
                grid-template-columns: repeat(2, minmax(0,1fr));
            }
        }

        @media (max-width: 700px) {
            .lex-calendar-cell {
                min-height: 75px;
                padding: 5px;
                font-size: 11px;
            }

                display: none;
            }

            .lex-flashcard-grid,
            .lex-achievement-grid,
            .lex-search-result,
            .lex-chart-row {
                grid-template-columns: 1fr;
            }
        }

            border-radius: 10px;
            padding: 13px;
            background: #111827;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }

        .lex-cancel-study {
            margin-top: 15px;
            border: 0;
            background: transparent;
            color: #dc2626;
            cursor: pointer;
        }

        /* BOTÃO */

        #lex-floating-button {
            position: fixed;
            z-index: 1000000;
            width: 92px;
            height: 36px;
            border: 0;
            border-radius: 10px;
            background: #111827;
            color: #fff;
            font-weight: 800;
            font-size: 12px;
            cursor: grab;
            box-shadow: 0 8px 25px rgba(0,0,0,.18);
        }

        /* MOBILE */

        @media (max-width: 900px) {
            .lex-sidebar {
                width: 220px;
                min-width: 220px;
            }

            .lex-stat-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .lex-grade-grid,
            .lex-note-grid,
            .lex-library-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            #lexstudy-app {
                display: block;
            }

            .lex-sidebar {
                position: fixed;
                left: -270px;
                top: 0;
                bottom: 0;
                height: 100dvh;
                max-height: 100dvh;
                z-index: 5;
                overflow: hidden;
                transition: .25s;
            }

            #lexstudy-app.mobile-open .lex-sidebar {
                left: 0;
            }

            .lex-mobile-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
                background: #fff;
                padding: 12px;
                border-radius: 12px;
            }

            .lex-mobile-header button {
                border: 0;
                background: #111827;
                color: #fff;
                border-radius: 8px;
                padding: 8px 12px;
            }

            .lex-main {
                padding: 12px;
            }

            .lex-stat-grid,
            .lex-two-col,
            .lex-plan-main,
            .lex-grade-grid,
            .lex-note-grid,
            .lex-library-grid {
                grid-template-columns: 1fr;
            }

            .lex-page-title {
                flex-direction: column;
            }

            .lex-subject-row {
                grid-template-columns: 1fr;
            }

            .lex-target-item {
                align-items: flex-start;
                flex-direction: column;
            }

            .lex-history-row {
                grid-template-columns: 1fr;
                gap: 4px;
            }

            #lex-timer-time {
                font-size: 48px;
            }

            .lex-study-box {
                padding: 25px;
            }
        }
    `);

    /* =========================================================
       INICIALIZAÇÃO
       ========================================================= */

    window.__lexRegisterMenuCommand(
        'Abrir LexStudy V4.0',
        () => {
            createApp();
            render();
        }
    );

    createFloatingButton();
    applyTheme();

    // Não abre automaticamente sobre o site.
    // Clique no botão LexStudy para abrir.
})();
</script>
</body>
</html>
